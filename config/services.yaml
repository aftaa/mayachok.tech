# yaml-language-server: $schema=../vendor/symfony/dependency-injection/Loader/schema/services.schema.json

# This file is the entry point to configure your own services.
# Files in the packages/ subdirectory configure your dependencies.
# See also https://symfony.com/doc/current/service_container/import.html

# Put parameters here that don't need to change on each machine where the app is deployed
# https://symfony.com/doc/current/best_practices.html#use-parameters-for-application-configuration
parameters:
    s3.key: '%env(S3_KEY)%'
    s3.secret: '%env(S3_SECRET)%'
    s3.bucket: '%env(S3_BUCKET)%'
    s3.endpoint: '%env(S3_ENDPOINT)%'
    s3.region: '%env(S3_REGION)%'

services:
    _defaults:
        autowire: true
        autoconfigure: true

    App\:
        resource: '../src/'
        exclude:
            - '../src/Legacy/'

#    App\Service\UploadLimiter:
#        arguments:
#            $redisDsn: '%env(REDIS_URL)%/2'

    # 👇 Автоматически регистрируем ВСЕ адаптеры с тегом
    App\Infrastructure\Mix\Doctrine\Specification\DoctrineSpecificationInterface:
        tags:
            - { name: 'app.doctrine.specification_adapter' }

    # 👇 Собираем все адаптеры в итератор
    App\Infrastructure\Mix\Doctrine\Specification\SpecificationAdapterFactory:
        arguments:
            $adapters: !tagged_iterator 'app.doctrine.specification_adapter'

    # 👇 Репозиторий
    App\Domain\Mix\Repository\MixRepositoryInterface:
        class: App\Infrastructure\Mix\Doctrine\Repository\DoctrineMixRepository
