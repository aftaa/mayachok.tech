[program:symfony-messenger]
command=php bin/console messenger:consume async --limit=1000 --time-limit=3600 --sleep=1
user=appuser
numprocs=2
process_name=%(program_name)s_%(process_num)02d
autostart=true
autorestart=true
stdout_logfile=/var/log/supervisor/messenger.out.log
stderr_logfile=/var/log/supervisor/messenger.err.log
